<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII ART WEB</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

            background: linear-gradient(
                -45deg,
                #0f172a,
                #1e293b,
                #312e81,
                #0f766e
            );
            background-size: 4000% 400%;
            animation: gradientMove 12s ease infinite;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            width: 150%;
            max-width: 900px;
        }
        h1 {
            color: #60a5fa;
            text-align: center;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow:
                0 0 10px rgba(96, 165, 250, 0.7),
                0 0 20px rgba(96, 165, 250, 0.5);
        }
        form {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(129, 140, 248, 0.2);
        }

        textarea {
            width: 100%;
            min-height: 180px;

            background: rgba(0, 0, 0, 0.3);
            color: white;

            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;

            padding: 15px;
            font-size: 1rem;
            resize: vertical;

            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
        }

        .radio-group {
            margin: 25px 0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        label {
            cursor: pointer;
            font-size: 1rem;
        }

        input[type="radio"] {
            accent-color: #60a5fa;
            margin-right: 6px;
        }

        button {
            background: linear-gradient(
                135deg,
                #3b82f6,
                #8b5cf6
            );

            color: white;
            border: none;
            border-radius: 10px;

            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;

            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5);
        }

        hr {
            margin: 30px 0;
            border: none;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .output {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);

            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);

            padding: 25px;

            overflow-x: auto;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        pre {
            color: #a5f3fc;
            font-family: "Courier New", monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            form {
                padding: 20px;
            }

            .radio-group {
                flex-direction: column;
                gap: 12px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>ASCII ART WEB</h1>

        <form action="/ascii-art" method="POST">

            <textarea
                name="text"
                placeholder="Enter the text you want to convert to ASCII Art, select your option and click Generate Ascii Art"
            >{{.Text}}</textarea>

            <div class="radio-group">

                <label>
                    <input
                        type="radio"
                        name="banner"
                        value="standard"
                        {{if eq .Banner "standard"}}checked{{end}}>
                    Standard
                </label>

                <label>
                    <input
                        type="radio"
                        name="banner"
                        value="shadow"
                        {{if eq .Banner "shadow"}}checked{{end}}>
                    Shadow
                </label>

                <label>
                    <input
                        type="radio"
                        name="banner"
                        value="thinkertoy"
                        {{if eq .Banner "thinkertoy"}}checked{{end}}>
                    Thinkertoy
                </label>

            </div>

            <button type="submit">
                Generate Your ASCII Art
            </button>

        </form>

        <hr>

        <div class="output">
            <pre>{{.Result}}</pre>
        </div>

    </div>

</body>
</html>
